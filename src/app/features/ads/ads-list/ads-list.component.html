<div class="ads-list-container">
  <app-ads-search (searchCriteriaChanged)="onSearch($event)"></app-ads-search>

  <div class="header-container">
    <h2>Liste des annonces</h2>
  </div>

  <table mat-table [dataSource]="ads" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let ad">{{ ad.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let ad">{{ ad.title }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Prix</th>
      <td mat-cell *matCellDef="let ad">{{ ad.price }} €</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Catégorie</th>
      <td mat-cell *matCellDef="let ad">
        {{ getCategoryLabel(ad.category) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef>Auteur</th>
      <td mat-cell *matCellDef="let ad">{{ ad.author }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let ad">
        <app-action-menu
          [item]="ad"
          (details)="viewDetails($event)"
          (edit)="editAd($event)"
          (delete)="deleteAd($event)"
        >
        </app-action-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <!-- Pagination -->
  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[2, 5, 10, 20, 50]"
    (page)="handlePageEvent($event)"
  >
  </mat-paginator>
</div>
